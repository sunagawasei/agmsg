name: tests

# Run the full Bats suite on every PR and on pushes to main. This repo is
# public, so GitHub-hosted runners are free — running everything every time is
# simpler and safer than selectively running "only the changed tests", which
# would miss regressions in shared libs (lib/*.sh) that fan out across many
# scripts. What we do instead is run the whole suite in parallel shards.
#
# Sharding: the suite has grown to ~790 tests, 11 min on ubuntu and 12-17 on
# macOS, which is the dominant wait on every PR. `bats-shard` splits it across
# SHARD_TOTAL runners per OS. The split is computed from the tree by
# .github/scripts/shard-tests.sh, NOT from a list in this file: a static list
# would put a newly added test file in no shard at all, and CI would go on
# reporting green while silently not running it. tests/test_ci_sharding.bats
# pins that the shards stay a partition of tests/*.bats.
#
# Docs-only skip (without the paths-ignore trap):
# the bats check is REQUIRED on main. A naive `paths-ignore` would mean it
# never reports on a docs-only PR, leaving it stuck "pending" forever and
# unmergeable. So instead the shard jobs ALWAYS run and ALWAYS complete green —
# a `changes` job decides whether the diff is docs-only, and only the heavy
# steps (install + run) are skipped when it is. The required context is
# therefore always reported; on docs-only PRs it just reports green in seconds
# without running the suite.
#
# The required context is the `bats` SUMMARY job, not the shards. Shard names
# carry their index, so changing SHARD_TOTAL would rename every required check
# and silently stop enforcing the ones branch protection still names. The
# summary job's name is stable across any future re-shard, and it fails unless
# the whole matrix succeeded — including when the matrix was skipped, which
# must never read as green.
#
# What counts as "docs-only" (= safe to skip the bash suite): the docs tree
# (`docs/**`), the marketing site (`site/**` — a standalone Astro app with no
# bearing on the bash suite), the desktop app (`app/**` — Rust/TS the bats
# suite never reads; it gets its own `app typecheck` job below instead),
# `llms.txt` / `llms-full.txt`, and the top-level prose docs (README,
# CHANGELOG, etc). SKILL.md is deliberately EXCLUDED — the suite asserts on it
# (tests/test_install.bats checks it has no unsubstituted placeholder), so a
# SKILL.md change must run the suite. Anything not on the allowlist runs it too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A PR run whose head has moved is dead weight: its verdict can be used for
# nothing, and it keeps holding the runner slots -- four macOS shards per run,
# and the account runs at most five macOS jobs at once (measured 2026-08-21:
# 35 runs that day, 140 macOS jobs, queue waits of 0-50 min, one PR's shard
# waiting 50 min behind runs whose heads had already been replaced). So a new
# run for the same PR cancels the one before it. A push to main is never
# cancelled: its group is its own run id, and that run is what a release reads
# (#848).
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Number of parallel shards per OS. Kept in one place because the matrix, the
  # job name, and the argument to shard-tests.sh must agree — if they drift, a
  # shard silently runs the wrong slice of the suite. Raising it is safe (the
  # split is recomputed, not hardcoded); it only changes the shard job names,
  # which is exactly why the required check is the summary job below.
  SHARD_TOTAL: 4
  # Pinned so the Windows sqlite cache key means something: a hit is the same
  # binary, not whatever the feed is serving today (#824). Bumping this is one
  # cache miss and one trip to chocolatey, which is the only time the community
  # feed is asked at all.
  WINDOWS_SQLITE_VERSION: '3.53.4'

jobs:
  # Cheap gate: is this PR's diff entirely documentation? Pushes to main always
  # run the full suite (docs_only=false) — main must stay fully verified.
  changes:
    name: detect docs-only
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      app_changed: ${{ steps.detect.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need base + head history to diff the PR range
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Event is '$EVENT' (not pull_request) — running the full suite."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"
          docs_only=true
          app_changed=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*) ;;
              site/*) ;;
              app/*) app_changed=true ;;
              llms.txt|llms-full.txt) ;;
              README.md|CHANGELOG.md|CONTRIBUTING.md|PRIVACY.md|ARCHITECTURE.md|RELEASING.md|LICENSE) ;;
              # NOTE: SKILL.md is intentionally not here — the suite tests it.
              *) docs_only=false ;;
            esac
          done <<< "$changed"
          echo "Result: docs_only=$docs_only app_changed=$app_changed"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "app_changed=$app_changed" >> "$GITHUB_OUTPUT"

  bats-shard:
    name: bats (${{ matrix.os }} ${{ matrix.shard }}/4)
    needs: changes
    # Run even if `changes` somehow failed/was skipped — fail open to the full
    # suite rather than leaving the required check unreported (which would
    # block the PR). When changes failed, docs_only is empty → heavy steps run.
    #
    # This is also why the matrix is a literal list rather than something the
    # `changes` job computes: a dynamic matrix cannot be evaluated when the job
    # that feeds it failed, so a broken `changes` would take the whole suite
    # down instead of falling back to running everything.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    # NOT "a timeout is a genuine hang" (#848): a cancellation here is a wall-
    # clock cap being reached, and a shard that is still passing tests right up
    # to the cap looks identical to one that is actually stuck. #857 hit this
    # on macOS at 25m29s with all 335 of its tests ok and the last one landing
    # at 24m53s -- a shard that finished normally a heartbeat too late, not a
    # hang. Distinguishing the two needs the job's own log (does the last `ok`
    # land seconds before cancellation, or does output stop cold with time
    # left on the cap), not this number.
    #
    # Sized with real margin, not "generous" by assertion. Measured 2026-08-19
    # (run 32193147987, macOS): the four shards ran 890s/824s/540s/1230s, and
    # the heaviest (1230s) had 270s of the old 1500s cap left -- 18%. After
    # #847's pin (shard-tests.sh) removes the two disproportionate files
    # (722s, 380s) from the ordinary weighted pool, the worst remaining shard
    # is estimated at the heavier pin's own floor (722s) plus a fair share of
    # what is left of the suite (~2382s / 4 shards =~ 595s, generously ~700s
    # unevenly) =~ 1420s, plus runner-speed variance -- call it 1700s. 1800s
    # (30m) leaves real headroom over that estimate, not merely over last
    # week's number. The 2 known intermittent reds (ubuntu 4/4's
    # `_wait_pidfile`, windows runtime #567) are unrelated to this cap.
    timeout-minutes: 30
    strategy:
      # Cover both GNU (Linux) and BSD (macOS) userlands — the scripts shell out
      # to sed/stat/mktemp/ps etc. whose flags differ between them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Must list exactly 1..SHARD_TOTAL. The `bats` summary job verifies
        # end-to-end that the shards actually covered every test file, so a
        # drift here fails the required check instead of silently dropping a
        # slice of the suite.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Docs-only change — skipping suite
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Diff is documentation-only; skipping the bats suite and reporting green to satisfy the required check."

      - name: Compute this shard's test files
        if: needs.changes.outputs.docs_only != 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          if [ "$SHARD" -gt "$SHARD_TOTAL" ]; then
            echo "::error::matrix shard $SHARD exceeds SHARD_TOTAL=$SHARD_TOTAL — the matrix and SHARD_TOTAL have drifted apart"
            exit 1
          fi
          .github/scripts/shard-tests.sh "$SHARD" "$SHARD_TOTAL" > shard-files.txt
          if [ ! -s shard-files.txt ]; then
            echo "::error::shard $SHARD of $SHARD_TOTAL was assigned no test files"
            exit 1
          fi
          echo "Shard $SHARD/$SHARD_TOTAL runs $(wc -l < shard-files.txt) file(s):"
          cat shard-files.txt

      - name: Ensure sqlite3 is available (Linux)
        if: runner.os == 'Linux' && needs.changes.outputs.docs_only != 'true'
        run: sqlite3 --version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y sqlite3; }

      # Install a modern bats-core (the suite uses BATS_TEST_TMPDIR) into a
      # HOME-local npm prefix. This avoids both the ubuntu runner's EACCES on
      # `npm i -g` under /usr/local and the macOS SIP block on /usr/lib that the
      # bats-core action's default install paths hit.
      - name: Install bats
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          npm config set prefix "$HOME/.npm-global"
          npm install -g bats
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          bash --version | head -1
          sqlite3 --version
          bats --version

      # Diagnostics for the shards that report every test ok and then sit
      # silent until the job's cap. The sampler writes to a file and never to
      # this step's stdout: a process holding that pipe is one of the things
      # under suspicion, so the instrument must not be able to cause what it is
      # measuring. It closes fds 3 and 4 for the same reason, and gives itself a
      # hard lifetime so it cannot outlive the job it is watching.
      - name: Start hang sampler
        if: needs.changes.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          set +e
          cat > "$RUNNER_TEMP/sampler.sh" <<'SAMPLER'
          #!/usr/bin/env bash
          out="$RUNNER_TEMP/hang-samples.txt"
          : > "$out"
          for i in $(seq 1 46); do
            [ -f "$RUNNER_TEMP/bats-done" ] && { echo "== bats finished, sampler stopping at sample $i" >> "$out"; break; }
            {
              echo "===== sample $i  $(date -u +%H:%M:%S)"
              ps -ef 2>/dev/null | grep -vE '\[' | tail -n +2
              # One lsof over every candidate at once. Per-pid calls put the two
              # ends of a pipe in separate blocks minutes apart in the log, and
              # a reader has to spot that two numbers match; in the 08-01 hang
              # nobody did, and a 14-line cap had cut the decisive line anyway.
              pids="$(ps -eo pid=,comm= 2>/dev/null \
                | awk '$2 ~ /node|python|bats|bash/ {printf "%s%s", sep, $1; sep=","}')"
              if [ -n "$pids" ]; then
                lsof -F pcftDin -p "$pids" 2>/dev/null > "$RUNNER_TEMP/sample-lsof.txt"
                echo "----- pipes held by more than one process:"
                awk -f "$GITHUB_WORKSPACE/.github/scripts/pipe-holders.awk" "$RUNNER_TEMP/sample-lsof.txt"
                echo "----- every descriptor they hold (no cap):"
                lsof -p "$pids" 2>/dev/null
              fi
              echo "----- bats temp dirs left behind:"
              ls -la "${TMPDIR:-/tmp}" 2>/dev/null \
                | awk 'tolower($0) ~ /bats/ { n++; if (n <= 20) print }'
            } >> "$out" 2>&1
            sleep 30
          done
          SAMPLER
          chmod +x "$RUNNER_TEMP/sampler.sh"
          nohup "$RUNNER_TEMP/sampler.sh" >/dev/null 2>&1 3>&- 4>&- &
          echo "sampler pid $!"

      - name: Run bats suite (this shard)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set +e
          xargs bats --print-output-on-failure < shard-files.txt
          status=$?
          : > "$RUNNER_TEMP/bats-done"
          exit $status

      # always() so this also runs when the job is cancelled at its cap, which
      # is the only case that matters here.
      # continue-on-error and a best-effort body: this step exists to describe a
      # failure, and a probe that returns non-zero -- lsof on a pid that has just
      # exited, a grep that matches nothing -- must never be what turns a green
      # shard red. The runner's default shell is `bash -e`, so -e is dropped
      # explicitly and every probe is allowed to fail. `head` is avoided in
      # pipelines for the same reason: it closes the pipe early and SIGPIPEs
      # whatever was writing.
      - name: Hang forensics
        if: always() && needs.changes.outputs.docs_only != 'true'
        continue-on-error: true
        run: |
          set +e
          set +o pipefail 2>/dev/null || true
          echo "##### live snapshot at $(date -u +%H:%M:%S 2>/dev/null)"
          ps -ef 2>/dev/null | awk 'NR > 1 && NR <= 61'
          # One snapshot over every candidate, so both ends of a pipe are in the
          # same dump and can be matched by machine rather than by eye.
          pids="$(ps -eo pid=,comm= 2>/dev/null \
            | awk '$2 ~ /node|python|bats|bash|sleep/ {printf "%s%s", sep, $1; sep=","}')"
          if [ -n "$pids" ]; then
            lsof -F pcftDin -p "$pids" 2>/dev/null > "$RUNNER_TEMP/forensic-lsof.txt"
          else
            : > "$RUNNER_TEMP/forensic-lsof.txt"
          fi
          echo "##### pipes held by more than one process:"
          echo "##### (a shard that reported every test ok and is still open is usually one of these:"
          echo "#####  a process that outlived its caller, holding the pipe bats is waiting to see close)"
          awk -f "$GITHUB_WORKSPACE/.github/scripts/pipe-holders.awk" "$RUNNER_TEMP/forensic-lsof.txt"
          echo "##### every descriptor those processes hold (no per-pid cap):"
          lsof -p "$pids" 2>/dev/null
          echo "##### bats temp remnants:"
          ls -la "${TMPDIR:-/tmp}" 2>/dev/null \
            | awk 'tolower($0) ~ /bats/ { n++; if (n <= 20) print }'
          echo "##### sampler timeline:"
          if [ -s "$RUNNER_TEMP/hang-samples.txt" ]; then
            cat "$RUNNER_TEMP/hang-samples.txt" 2>/dev/null
          else
            echo "(no samples)"
          fi
          exit 0

      - name: Upload hang samples
        if: always() && needs.changes.outputs.docs_only != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hang-samples-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/hang-samples.txt
          if-no-files-found: ignore
          retention-days: 3

      # What the summary job checks the partition against. Uploaded only when
      # the suite actually ran, so a docs-only PR produces none — and the
      # summary skips the check for exactly that case.
      - name: Record which files this shard ran
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bats-manifest-${{ matrix.os }}-${{ matrix.shard }}
          path: shard-files.txt
          retention-days: 1

  # The REQUIRED status check. Shard job names carry their index, so making the
  # shards required would mean branch protection had to be re-pointed every
  # time SHARD_TOTAL changed — and until someone did, protection would be
  # enforcing check names that no longer run. This job's name never changes.
  #
  # It fails unless the whole matrix succeeded. `skipped` is treated as failure
  # too: a suite that did not run is not a suite that passed, and the whole
  # point of the always-report pattern above is that green means something.
  bats:
    name: bats
    needs: [changes, bats-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check shard results
        env:
          RESULT: ${{ needs.bats-shard.result }}
        run: |
          set -euo pipefail
          echo "bats shard matrix result: $RESULT"
          case "$RESULT" in
            success) ;;
            skipped) echo "::error::the bats shards did not run — refusing to report green"; exit 1 ;;
            *)       echo "::error::the bats shards did not all pass (result: $RESULT)"; exit 1 ;;
          esac

      - name: Docs-only change — no shard manifests to verify
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Diff is documentation-only; the shards reported green without running, so there is no partition to verify."

      - name: Download shard manifests
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: bats-manifest-*
          path: manifests

      # The end-to-end guarantee: every tests/*.bats file was actually run, on
      # every OS. A partition bug in shard-tests.sh, a matrix entry someone
      # deleted, a new test file that landed nowhere — all of them show up here
      # as a named missing file rather than as a green run that quietly tested
      # less than it did yesterday.
      - name: Verify the shards covered the whole suite
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          expected="$(find tests -maxdepth 1 -name '*.bats' | LC_ALL=C sort)"
          status=0
          for os in ubuntu-latest macos-latest; do
            actual="$(cat manifests/bats-manifest-"$os"-*/shard-files.txt | LC_ALL=C sort)"
            if [ "$actual" = "$expected" ]; then
              echo "$os: all $(printf '%s\n' "$expected" | wc -l | tr -d ' ') test file(s) ran."
              continue
            fi
            status=1
            missing="$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual" | uniq))"
            extra="$(comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual" | uniq))"
            dupes="$(printf '%s\n' "$actual" | uniq -d)"
            # Plain `if`s, not `[ -n "$x" ] && echo`: under `set -e` a false
            # test at the end of a && list exits the step, which would report
            # only the first kind of discrepancy and swallow the rest.
            if [ -n "$missing" ]; then
              printf '::error::%s: test file(s) run by no shard:\n%s\n' "$os" "$missing"
            fi
            if [ -n "$extra" ]; then
              printf '::error::%s: shard(s) ran file(s) not in tests/:\n%s\n' "$os" "$extra"
            fi
            if [ -n "$dupes" ]; then
              printf '::error::%s: file(s) run by more than one shard:\n%s\n' "$os" "$dupes"
            fi
          done
          exit "$status"

  # Windows coverage for the native helpers shipped in #103 (Git Bash runner,
  # sqlite3 compatibility shim, cygpath normalization). The POSIX-assuming suite
  # is not fully green on Windows yet, so this is staged (#125): a single focused
  # leg targeting the Windows-relevant install tests. Not a required check yet —
  # promote it to required once it is reliably green. The required checks stay
  # bats (ubuntu/macos).
  #
  # The old informational "full" leg (the whole suite, continue-on-error) was
  # removed: it ran POSIX-assuming tests that hang on Windows and hit the job
  # timeout. A timed-out job reports "cancelled", and continue-on-error does NOT
  # absorb a cancellation (only a failure), so it turned the whole tests run red.
  # Windows-relevant tests get fixed in separate PRs and folded into this leg.
  bats-windows:
    name: bats (windows-latest, ${{ matrix.leg }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    # Bound the job so an unexpected hang can't pin a runner. The focused leg is
    # fast and green today; this is just a safety net.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          # Focused leg: the install-side native Windows helpers (#103). These
          # are green on windows-latest today and are the candidate to promote
          # to a required check.
          - leg: install helpers
            filter: "[Ww]indows"
            target: tests/test_install.bats
          # The Windows runtime path, which nothing here covered until #567: a
          # change to how liveness is decided on Windows shipped through a CI
          # that never decided liveness on Windows. Everything else about that
          # class is proved against a `tasklist` stub on a POSIX host, which
          # shows what the code does when a probe says "not found" -- not that
          # Git Bash says it, and not that a launch survives it.
          #
          # These two run with the real tasklist and the real MSYS pid space,
          # and they assert the EFFECT rather than the premise: the TUI reaches
          # its bridged --remote handoff, and a bridge is actually started.
          # Reaching the handoff is not delivering a message -- they are
          # separate failure points and each has its own test.
          - leg: windows runtime (#567)
            filter: "windows-native"
            target: tests/test_codex_monitor.bats tests/test_codex_bridge_launcher.bats
    defaults:
      run:
        # bats is bash; on Windows runners `shell: bash` is Git Bash, the same
        # environment native Windows users run agmsg under.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Docs-only change — skipping suite
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Diff is documentation-only; skipping the Windows bats legs."

      # A THIRD PARTY'S BAD MINUTE MUST NOT BE REPORTED AS THIS CHANGE'S RED
      # (#824). `choco install sqlite -y --no-progress` was one call with no
      # retry, no cache and — the part that did the damage — no check. On a 503
      # from the community feed it printed "Chocolatey installed 0/0 packages"
      # and EXITED ZERO, so the step went green, the version step's
      # `|| echo "not found"` turned a missing binary into a success line, and
      # the red landed three steps later on `Run tests`. Measured on
      # run 31869238895: steps 4, 5, 6 and 7 all `success`, step 8 `failure`,
      # with `sqlite3: command not found` in step 7's own log.
      #
      # Reading that check list, the failure belongs to the change under test.
      # It did not. The feed's flakiness is not ours to fix; which step goes red
      # is.
      #
      # EVERY STEP HERE IS GATED ON `matrix.sqlite`, which #822 added. A leg that
      # never opens a store must not be stopped by a package feed either — that
      # is the contract #822 built, and hardening the install would have
      # cancelled it by making `driver input (#817)` depend on chocolatey again.
      #
      # The restore is tried first so most runs never ask the feed at all: the
      # key is the pinned version, so a hit is the same binary and a miss is the
      # only thing that needs the network.
      - name: Restore sqlite3 (cache)
        if: needs.changes.outputs.docs_only != 'true' && matrix.sqlite
        id: sqlite-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\ProgramData\chocolatey\lib\SQLite
            C:\ProgramData\chocolatey\bin\sqlite3.exe
          key: sqlite3-${{ runner.os }}-choco-${{ env.WINDOWS_SQLITE_VERSION }}

      - name: Install sqlite3
        if: needs.changes.outputs.docs_only != 'true' && matrix.sqlite && steps.sqlite-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Three attempts with a widening pause. The observed failures are 503
          # and 504 from `community.chocolatey.org`, and they are per-request
          # rather than an outage: on run 31869238895 the two Windows legs ran
          # concurrently and one of them installed fine.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install sqlite --version=$env:WINDOWS_SQLITE_VERSION -y --no-progress
            if (Test-Path 'C:\ProgramData\chocolatey\bin\sqlite3.exe') { exit 0 }
            Write-Host "::warning::sqlite3 not installed on attempt $attempt; the chocolatey feed is answering errors"
            Start-Sleep -Seconds (10 * $attempt)
          }
          exit 0   # the hard check is its own step, so a retry loop cannot decide the colour

      - name: Put chocolatey shims on PATH (Git Bash form)
        if: needs.changes.outputs.docs_only != 'true'
        run: echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"

      # THE STEP THAT IS ALLOWED TO BE RED ABOUT THIS. Separate from the install
      # on purpose: whether the dependency is present is a different question
      # from whether one `choco` invocation worked, and only this one may decide
      # the job's colour. Named so the check list says what is wrong — a reader
      # seeing this red does not go looking through the diff.
      - name: sqlite3 must be present, or this leg is about chocolatey
        if: needs.changes.outputs.docs_only != 'true' && matrix.sqlite
        run: |
          if ! sqlite3 --version; then
            echo "::error::sqlite3 is missing. The chocolatey community feed did not serve it (503/504 seen on 2026-08-15). This leg reports on that, NOT on the change under test — see #824."
            exit 1
          fi

      - name: Install bats
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          npm config set prefix "$HOME/.npm-global"
          npm install -g bats
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      # Fail HERE if a tool is missing, not three minutes later inside the suite.
      # The trailing `|| echo` this used to end with turned a missing sqlite3
      # into a passing step, so the real symptom surfaced as unrelated install
      # tests failing with "sqlite3 is required but not found" — which reads as
      # a defect in whatever PR happened to be running.
      - name: Show tool versions
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          bash --version | head -1
          # Two changes here, pulling in opposite directions (#824).
          #
          # The `|| sqlite3.exe --version || echo "sqlite3 not found on PATH"`
          # fallback is gone: it turned a missing binary into a success line, so
          # nothing between a failed install and `Run tests` said anything was
          # wrong. Absence is decided by the presence check above, which is
          # allowed to be red about it.
          #
          # Without the fallback this line would fail on a leg that never
          # installs sqlite3 — `driver input (#817)` carries `sqlite: false`
          # precisely so a package feed cannot stop a leg driving a mock bash
          # driver. Reporting a version it was never meant to have would
          # re-create, one step lower, the coupling #822 removed.
          # `matrix.sqlite` is a fixed value from the matrix above.
          if [ "${{ matrix.sqlite }}" = "true" ]; then
            sqlite3 --version
          fi
          bats --version

      - name: Run tests
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          # matrix.target may name multiple files (space-separated) — leave it
          # unquoted so the shell word-splits it into separate bats path args.
          # It's a fixed value from the matrix above, not external input.
          if [ -n "${{ matrix.filter }}" ]; then
            bats --print-output-on-failure --filter "${{ matrix.filter }}" ${{ matrix.target }}
          else
            bats --print-output-on-failure ${{ matrix.target }}
          fi

  # The desktop app (app/**) is Rust + TypeScript — the bats suite never
  # reads it, and the full Tauri build only runs on app-v* release tags via
  # app-release.yml. Without this job an app-only PR would merge with zero
  # compile verification (the bats legs skip via the app/* allowlist above).
  # cargo check + tsc --noEmit is a few minutes, not the full-bundle cost.
  # Same always-report pattern as bats: the job always completes, and only
  # the heavy steps are gated, so it can be promoted to a required check
  # without ever leaving a PR stuck pending. Pushes to main always run it.
  # Fail-open mirrors bats too: steps skip only on an EXPLICIT
  # app_changed=false — if the changes job breaks and its output is empty,
  # the typecheck runs rather than green-washing a possibly-app diff.
  app-check:
    name: app typecheck
    needs: changes
    if: ${{ !cancelled() }}
    # macOS: Tauri's crates (wry etc.) compile against system frameworks that
    # are already on the runner — ubuntu would need the webkit2gtk/gtk dev
    # stack installed first. Also matches the release build environment.
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: No app changes — skipping typecheck
        if: needs.changes.outputs.app_changed == 'false'
        run: echo "Diff does not touch app/ — reporting green without running the typecheck."

      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.app_changed != 'false'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.app_changed != 'false'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.app_changed != 'false'

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.app_changed != 'false'
        with:
          workspaces: app/src-tauri

      - name: Install frontend deps
        if: needs.changes.outputs.app_changed != 'false'
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        if: needs.changes.outputs.app_changed != 'false'
        run: pnpm exec tsc --noEmit

      - name: Frontend tests
        if: needs.changes.outputs.app_changed != 'false'
        run: pnpm test

      - name: Bundle pinned agmsg-core
        if: needs.changes.outputs.app_changed != 'false'
        run: scripts/bundle-core.sh

      - name: Rust check
        if: needs.changes.outputs.app_changed != 'false'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        if: needs.changes.outputs.app_changed != 'false'
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Windows leg for the app: the command layer's bash resolution and path
  # conversion are all behind cfg(windows) and had never run in CI — the very
  # 0.1.1→0.1.3 regressions (WSL bash.exe, backslash argv). This runs cargo test
  # on windows-latest so those paths are actually exercised. Same fail-open
  # convention as app-check: run unless the diff provably doesn't touch app/.
  app-test-windows:
    name: app test (windows-latest)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: No app changes — skipping app tests
        if: needs.changes.outputs.app_changed == 'false'
        run: echo "Diff does not touch app/ — reporting green without running the app tests."

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.app_changed != 'false'

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.app_changed != 'false'
        with:
          workspaces: app/src-tauri

      - name: Bundle pinned agmsg-core
        if: needs.changes.outputs.app_changed != 'false'
        run: scripts/bundle-core.sh
        shell: bash

      - name: Rust tests
        if: needs.changes.outputs.app_changed != 'false'
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Internal team names must not reach what we publish. This runs on EVERY diff,
  # with no docs-only skip: the docs tree is exactly where prose names people,
  # and a check that skips the files most likely to carry the problem is
  # decoration. It costs one node process over `git ls-files`.
  #
  # SHAPE ONLY, AND THAT IS A DECISION, NOT AN ACCIDENT.
  #
  # Seat names have a shape (<base>-cc<n> / <base>-co<n>), so a pattern catches
  # the whole class -- including seats nobody has created yet -- while putting
  # no name into this repository. That half runs here.
  #
  # Names with no shape (a person's handle, a project nickname) are NOT checked
  # by CI. Checking them needs the list of them, and the only way to give CI
  # that list is to hand it to GitHub as a secret -- publishing, to a third
  # party, the names the rule exists to keep unpublished. So that half runs
  # before push, from a private checkout that holds the list, and never here.
  #
  # A green here therefore means "no seat-shaped name", not "no internal name".
  # The script prints that in a banner rather than letting the distinction live
  # only in this comment. `none` is passed explicitly for the same reason: an
  # UNSET list is exit 2, so a run that checks half of what it claims can only
  # happen because someone wrote it down, never because a variable was missing.
  enforced-assertions:
    name: enforceable assertions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Always runs and always reports, like every other job here: a job that
    # skips on some diffs is a required context that can sit pending forever
    # (see the paths-ignore note at the top of this file). It reads only
    # `tests/*.bats`, so it is cheap enough to run unconditionally rather than
    # to gate.
    steps:
      - uses: actions/checkout@v4

      # No bats, no bash 3.2, no runners: this is a static read of the test
      # sources. The BEHAVIOUR it encodes was measured on both shells (#670);
      # what runs here is the count.
      - name: No new assertion that cannot fail
        run: .github/scripts/check-enforced-assertions.sh

  private-names:
    name: internal names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `none` is written out here on purpose: it is the difference between
      # "we check the shapes" and "nobody configured anything".
      - name: Check the shapes we publish (unshaped names are checked before push)
        run: AGMSG_PRIVATE_NAMES=none node scripts/check-private-names.mjs
