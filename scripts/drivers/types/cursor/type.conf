# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
name=cursor
template=template.md
cli=cursor-agent
spawnable=yes
headless=yes
model_arg=--model
detect_proc=cursor-agent cursor-agent-*
hooks_file=.cursor/hooks.json
monitor=no
stop_output=followup
session_team=yes
# Session identity (scripts/lib/session-team.sh). cursor-agent's shell tool exports
# CURSOR_CONVERSATION_ID (the same uuid its hooks send as session_id and
# conversation_id). A cursor session team is only trusted with a marker file and
# a uuid-form id, since its prefix is not reserved against project team names.
session_env=CURSOR_CONVERSATION_ID
session_team_prefix=cur-
session_seat=cursor-host
session_sid_strict_uuid=yes
session_marker=yes
delivery_modes=monitor turn both off
